<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#0b0620">
<title>Glitter Tower controller</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&display=swap">
<style>
  /* The Glitter Tower on the phone: join with the room code, then three big jump buttons: up-left, up, up-right. */
  :root{--ink:#fff;--mute:#c3c6ea;--line:rgba(255,255,255,.16);--col:#ffd166}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;background:#0b0620;color:var(--ink);font-family:"Bricolage Grotesque",system-ui,sans-serif;overflow:hidden;touch-action:manipulation;user-select:none;-webkit-user-select:none;overscroll-behavior:none}
  .screen{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px 16px;gap:14px;text-align:center}
  .hidden{display:none!important}
  h1{margin:0;font-size:1.6rem}
  p{margin:0;color:var(--mute);line-height:1.4}
  input{font:inherit;font-size:1.2rem;font-weight:700;padding:14px 16px;border-radius:14px;border:1px solid var(--line);background:rgba(255,255,255,.06);color:#fff;width:min(320px,100%);text-align:center}
  button.go{font:inherit;font-size:1.15rem;font-weight:800;padding:14px 26px;border-radius:14px;border:0;background:#ffd166;color:#2a1a00}
  .top{position:fixed;left:0;right:0;top:0;display:flex;justify-content:space-between;align-items:center;padding:12px 16px;font-weight:800}
  .top .nm{display:flex;align-items:center;gap:8px} .top .dot{width:14px;height:14px;border-radius:50%;background:var(--col)}
  #big{position:fixed;left:16px;right:16px;top:70px;text-align:center;font-size:clamp(1.4rem,7vw,2.2rem);font-weight:800;line-height:1.2}
  #big .small{display:block;font-size:1rem;font-weight:600;color:var(--mute);margin-top:8px}
  #pads{position:fixed;left:12px;right:12px;bottom:max(16px,env(safe-area-inset-bottom));height:min(52vh,330px);display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
  #pads button{font:inherit;font-size:clamp(2.6rem,14vw,4.4rem);font-weight:800;border-radius:24px;border:2px solid var(--line);background:rgba(255,255,255,.05);color:rgba(255,255,255,.35);transition:background .12s,transform .08s,border-color .2s}
  body.go #pads button{background:color-mix(in srgb,var(--col) 28%,transparent);border-color:var(--col);color:#fff;box-shadow:0 0 30px color-mix(in srgb,var(--col) 40%,transparent)}
  body.go #pads button:active{transform:scale(.96);background:color-mix(in srgb,var(--col) 60%,transparent)}
  #pads button.off{opacity:.15!important;box-shadow:none!important}
  body.fall #pads{opacity:.4}
</style>
</head>
<body>
<div class="screen" id="join">
  <h1>✨ The Glitter Tower</h1>
  <p>Join the climb on the big screen.</p>
  <input id="name" maxlength="14" placeholder="Your name" autocomplete="nickname">
  <input id="code" maxlength="4" placeholder="Room code" autocapitalize="characters">
  <button class="go" id="go">Join</button>
  <p id="jmsg"></p>
</div>
<div class="hidden" id="game">
  <div class="top"><span class="nm"><span class="dot" id="dot"></span><span id="me"></span></span><span id="fl"></span></div>
  <div id="big">Watch the big screen</div>
  <div id="pads"><button data-j="-1" type="button">↖</button><button data-j="0" type="button">↑</button><button data-j="1" type="button">↗</button></div>
</div>
<script src="vendor/supabase.js?v=1"></script>
<script src="config.js?v=1"></script>
<script src="net.js?v=2"></script>
<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var st = { get: function (k) { try { return localStorage.getItem(k); } catch (e) { return null; } }, set: function (k, v) { try { localStorage.setItem(k, v); } catch (e) {} } };
  var pid = st.get('tw-pid'); if (!pid) { pid = 'p' + Math.random().toString(36).slice(2, 10); st.set('tw-pid', pid); }
  var q = new URLSearchParams(location.search), room = (q.get('r') || '').toUpperCase().replace(/[^A-Z]/g, '').slice(0, 4);
  $('name').value = st.get('tw-name') || st.get('esc-name') || ''; $('code').value = room;
  var net = null, name = '', joinedOk = false, my = null, lastS = '';
  $('go').addEventListener('click', join);
  function join() {
    name = $('name').value.trim().slice(0, 14); room = $('code').value.toUpperCase().replace(/[^A-Z]/g, '').slice(0, 4);
    if (!name) { $('jmsg').textContent = 'Type your name first.'; return; }
    if (room.length !== 4) { $('jmsg').textContent = 'The room code has 4 letters (it’s on the big screen).'; return; }
    st.set('tw-name', name); $('jmsg').textContent = 'Joining…';
    net = escConnect('tw' + room); net.on('state', onState);
    var hi = function () { if (!joinedOk) net.send('hi', { pid: pid, name: name }); };
    hi(); setInterval(hi, 1500);   // (keep saying hello until the big screen has us)
  }
  function buzz(p) { try { navigator.vibrate && navigator.vibrate(p); } catch (e) {} }
  function onState(s) {
    if (!s || !s.p) return;
    my = s.p[pid] || null;
    if (my && !joinedOk) { joinedOk = true; $('join').classList.add('hidden'); $('game').classList.remove('hidden'); }
    if (!joinedOk) return;
    $('me').textContent = name;
    var big = $('big'), txt = '', cls = '';
    if (!my) { big.innerHTML = 'A climb is in progress<span class="small">You’ll join the next one</span>'; document.body.className = ''; return; }
    document.documentElement.style.setProperty('--col', my.c || '#8a93b8'); $('dot').style.background = my.c || 'rgba(255,255,255,.25)';
    $('fl').textContent = s.ph === 'lobby' ? '' : 'Floor ' + (my.f || 0);
    if (s.ph === 'lobby') txt = 'You’re in, ' + esc(name) + '!<span class="small">Wait for the host to start</span>';
    else if (s.ph === 'end') txt = (my.r === 1 ? '🏆 You climbed highest!' : 'You finished ' + ordinal(my.r || 0)) + '<span class="small">Floor ' + (my.f || 0) + '</span>';
    else if (my.s === 'ready') { txt = 'Your turn is next!<span class="small">Watch Stella’s wand on the big screen</span>'; if (lastS !== 'ready') buzz(40); }
    else if (my.s === 'go' || my.s === 'air') { cls = 'go'; txt = 'Jump!' + (s.left != null ? '<span class="small">' + s.left + ' s left</span>' : ''); if (lastS !== 'go' && lastS !== 'air') buzz(60); }
    else if (my.s === 'fall') { cls = 'go fall'; txt = 'Whoops! Down 3 floors'; if (lastS !== 'fall') buzz([120, 50, 120]); }
    else if (my.g != null) txt = (my.g > 0 ? '+' : '') + my.g + (Math.abs(my.g) === 1 ? ' floor' : ' floors') + '<span class="small">Now on floor ' + (my.f || 0) + '</span>';
    else txt = 'Watch the others climb<span class="small">Round ' + (s.rd || 1) + ' of 3</span>';
    lastS = my.s || '';
    document.body.className = cls; big.innerHTML = txt;
    [].forEach.call(document.querySelectorAll('#pads button'), function (b) { var to = (my.x == null ? 1 : my.x) + +b.getAttribute('data-j'); b.classList.toggle('off', to < 0 || to > 2); });   // (no jumping off the side of the tower)
  }
  [].forEach.call(document.querySelectorAll('#pads button'), function (b) {
    var fire = function (e) { e.preventDefault(); if (!net || !my || b.classList.contains('off') || (my.s !== 'go' && my.s !== 'air')) return; net.toHost('zg', { pid: pid, j: +b.getAttribute('data-j') }); buzz(15); };   // (the jump goes straight to the big screen, which checks it)
    b.addEventListener('touchstart', fire, { passive: false }); b.addEventListener('mousedown', fire);
  });
  if (room.length === 4 && $('name').value) $('go').focus();
})();
</script>
</body>
</html>
