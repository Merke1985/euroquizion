<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#060a1c">
<title>Blackbird controller</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&display=swap">
<style>
  /* Blackbird on the phone: join the flock with the room code, then one big button. Hold to fly up, let go to glide. */
  :root{--ink:#fff;--mute:#aab4dc;--line:rgba(255,255,255,.16);--col:#ffd166}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;background:#060a1c;color:var(--ink);font-family:"Bricolage Grotesque",system-ui,sans-serif;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;overscroll-behavior:none}
  .screen{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px 16px;gap:14px;text-align:center}
  .hidden{display:none!important}
  h1{margin:0;font-size:1.6rem}
  p{margin:0;color:var(--mute);line-height:1.4}
  input{font:inherit;font-size:1.2rem;font-weight:700;padding:14px 16px;border-radius:14px;border:1px solid var(--line);background:rgba(255,255,255,.06);color:#fff;width:min(320px,100%);text-align:center}
  button.go{font:inherit;font-size:1.15rem;font-weight:800;padding:14px 26px;border-radius:14px;border:0;background:#ffd166;color:#2a1a00}
  .top{position:fixed;left:0;right:0;top:0;display:flex;justify-content:space-between;align-items:center;padding:12px 16px;font-weight:800}
  .top .nm{display:flex;align-items:center;gap:8px} .top .dot{width:14px;height:14px;border-radius:50%;background:var(--col)}
  .fe{letter-spacing:-.1em}
  #pad{position:fixed;left:16px;right:16px;top:calc(64px + (100vh - 160px) * .125);bottom:calc(96px + (100vh - 160px) * .125);top:calc(64px + (100dvh - 160px) * .125);bottom:calc(96px + (100dvh - 160px) * .125);border-radius:32px;display:grid;place-items:center;background:rgba(255,255,255,.04);border:2px solid var(--line);transition:background .2s,box-shadow .2s,border-color .2s}
  body.neon::after{content:'';position:fixed;inset:0;border:10px solid var(--col);border-radius:22px;box-shadow:inset 0 0 26px var(--col),0 0 0 1px var(--col);pointer-events:none;z-index:9;animation:neon 2.4s ease-in-out infinite}   /* (the neon of your bird, all round the phone) */
  @keyframes neon{50%{box-shadow:inset 0 0 44px var(--col),0 0 0 1px var(--col)}}
  #pad.pre #view{display:block} #pad.pre .big{display:none}
  #view{position:absolute;inset:0;width:100%;height:100%;border-radius:30px;display:none}
  #pad.fly #view{display:block}
  #pad.fly .big{position:absolute;left:0;right:0;bottom:14px;font-size:1rem;opacity:.75;pointer-events:none}
  #pad.fly .big .small{display:none}
  #pad{overflow:hidden}
  #pad .big{font-size:clamp(1.4rem,7vw,2.4rem);font-weight:800;line-height:1.2;padding:0 16px}
  #pad .small{display:block;font-size:1rem;font-weight:600;color:var(--mute);margin-top:8px}
  #pad.warn{border-color:var(--col)}
  @keyframes blink{50%{border-color:rgba(255,255,255,.1);box-shadow:none}}
  #pad.warn{box-shadow:0 0 40px var(--col)}
  #pad.fly{background:color-mix(in srgb,var(--col) 28%,transparent);border-color:var(--col);box-shadow:0 0 60px color-mix(in srgb,var(--col) 60%,transparent)}
  #pad.fly.down{background:color-mix(in srgb,var(--col) 60%,transparent);transform:scale(.985)}
  #pad.fly .small{color:#fff}
  #pad.out{opacity:.5}
  .msg{position:fixed;left:16px;right:16px;bottom:22px;text-align:center;color:var(--mute);font-weight:600;min-height:3em}
  .lagt{display:flex;align-items:center;gap:8px;justify-content:center;margin:4px 0 12px;font-weight:600;color:var(--mute)} .lagt input{width:20px;height:20px;margin:0}
</style>
</head>
<body>
<div class="screen" id="join">
  <h1>🐦‍⬛ Blackbird</h1>
  <p>Join the flock on the big screen.</p>
  <input id="name" maxlength="14" placeholder="Your name" autocomplete="nickname">
  <input id="code" maxlength="4" placeholder="Room code" autocapitalize="characters">
  <label class="lagt"><input type="checkbox" id="lag"> 🧪 Test: 1 second delay</label>
  <button class="go" id="go">Join</button>
  <p id="jmsg"></p>
</div>
<div class="hidden" id="game">
  <div class="top"><span class="nm"><span class="dot" id="dot"></span><span id="me"></span></span><span class="fe" id="fe"></span></div>
  <div id="pad"><canvas id="view"></canvas><div class="big" id="big">Watch the big screen</div></div>
  <div class="msg" id="msg"></div>
</div>
<script src="vendor/supabase.js?v=1"></script>
<script src="config.js?v=1"></script>
<script src="net.js?v=2"></script>
<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var st = { get: function (k) { try { return localStorage.getItem(k); } catch (e) { return null; } }, set: function (k, v) { try { localStorage.setItem(k, v); } catch (e) {} } };
  var pid = st.get('bb-pid'); if (!pid) { pid = 'p' + Math.random().toString(36).slice(2, 10); st.set('bb-pid', pid); }
  var EQ = new URLSearchParams(location.search), EMBED = EQ.get('embed') === '1'; if (EMBED && EQ.get('pid')) pid = EQ.get('pid');   // (inside the main game: you're already known)
  var q = new URLSearchParams(location.search), room = (q.get('r') || '').toUpperCase().replace(/[^A-Z]/g, '').slice(0, 4);
  $('lag').checked = q.get('lag') === '1';
  $('name').value = st.get('bb-name') || st.get('esc-name') || ''; $('code').value = room;
  var name0 = '', net = null, name = '', joinedOk = false, hiT = null, my = null, held = false, lastF = 5;
  $('go').addEventListener('click', join);
  if (EMBED) { $('name').value = (EQ.get('name') || 'Bird').slice(0, 14); $('join').classList.add('hidden'); setTimeout(join, 50); }
  function join() {
    name = $('name').value.trim().slice(0, 14); room = $('code').value.toUpperCase().replace(/[^A-Z]/g, '').slice(0, 4);
    if (!name) { $('jmsg').textContent = 'Type your name first.'; return; }
    if (room.length !== 4) { $('jmsg').textContent = 'The room code has 4 letters (it’s on the big screen).'; return; }
    st.set('bb-name', name); $('jmsg').textContent = 'Joining…';
    net = escConnect('bb' + room);
    var LAG = $('lag').checked ? 500 : 0;   // (test: half a second each way, so the big screen sees this phone a full second late)
    if (LAG) { var raw = net.toHost.bind(net); net.toHost = function (ev, d) { setTimeout(function () { raw(ev, d); }, LAG); }; name0 = ' 🧪 1 s delay'; }
    net.on('state', LAG ? function (s) { setTimeout(function () { onState(s); }, LAG); } : onState);
    var hi = function () { if (!joinedOk) net.send('hi', { pid: pid, name: name }); };
    hi(); hiT = setInterval(hi, 1500);   // (keep saying hello until the big screen has us)
  }
  function km(d) { d = d || 0; return d >= 1000 ? (d / 1000).toFixed(2) + ' km' : d + ' m'; }   // (distances: metres, or km past 1000 m)
  function onState(s) {
    if (!s || !s.p) return;
    my = s.p[pid] || null;
    if (s.k) K = s.k; if (s.br) br = s.br;
    if (s.t != null) { var at = now(); clk = { t: s.t, at: at, cam: s.cam, ct: s.t }; }
    live = s.live && s.live[pid] || null;
    var wasFly = fly; fly = s.ph === 'play' && !!my && my.s === 'fly';
    if (fly && !wasFly) { by = K && gameT() < K.P0 + 3 ? 0.5 : live ? live.y : 0.5; bvy = 0; inv = 0; }   // (taking over: at the start from the middle, as the phone showed it; later where the big screen has your bird)   // (taking over: start where the big screen has your bird)
    if (s.ph !== 'play') { hc = 0; fly = false; }
    if (my && !joinedOk) { joinedOk = true; $('join').classList.add('hidden'); $('game').classList.remove('hidden'); }
    if (!joinedOk) return;
    $('me').textContent = name + name0;
    var pad = $('pad'), big = $('big'), msg = $('msg');
    if (!my) { pad.className = ''; big.innerHTML = 'A flight is in progress<span class="small">You’ll fly in the next one</span>'; msg.textContent = ''; return; }
    document.documentElement.style.setProperty('--col', my.c || '#8a93b8');
    $('dot').style.background = my.c || 'rgba(255,255,255,.25)';
    $('fe').textContent = s.ph === 'lobby' ? '' : my.f ? '🪶'.repeat(my.f) : '🌿';
    if (my.f != null && my.f < lastF) { try { navigator.vibrate && navigator.vibrate([90, 40, 90]); } catch (e) {} }   // (lost a feather)
    if (my.f != null) lastF = my.f;
    var cls = '', txt = '', m = '';
    if (s.ph === 'lobby') { txt = 'You’re in, ' + esc(name) + '!<span class="small">Wait for the host to start</span>'; lastF = 5; }
    else if (s.ph === 'end') { txt = (my.solo ? (my.f >= 5 ? '🏆 A perfect flight!' : my.d != null ? '🪶 You flew ' + km(my.d) : '🪶 You kept ' + (my.f || 0) + ' of 5 feathers') : my.d != null && my.r !== 1 ? 'You flew ' + km(my.d) + ' (' + ordinal(my.r || 0) + ')' : my.d != null ? '🏆 You flew furthest! (' + km(my.d) + ')' : my.r === 1 ? '🏆 You win!' : 'You finished ' + ordinal(my.r || 0)) + '<span class="small">' + (s.cd ? 'Game ends in ' + s.cd : 'Look at the big screen') + '</span>'; }
    else if (s.ph === 'shop') { txt = my.win ? '🛍️ You may pick an item in the boutique!' : '🛍️ Off to the boutique…<span class="small">Look at the big screen</span>'; }
    else if (my.s === 'done') { txt = 'Look at the big screen'; }
    else if (my.s === 'out') { cls = 'out'; txt = '🪶 Your bird lost all their feathers<span class="small">Watch the rest fly</span>'; }
    else if (my.s === 'fly') { cls = 'fly' + (held ? ' down' : ''); txt = 'Hold to fly up · let go to glide'; }
    else if (my.s === 'warn') { cls = 'warn'; txt = 'Get ready…<span class="small">You’re about to fly</span>'; try { navigator.vibrate && navigator.vibrate(30); } catch (e) {} }
    else { txt = 'Watch the big screen'; }
    if (my.c && s.ph === 'play' && my.s !== 'fly' && my.s !== 'out' && my.s !== 'done') m = 'This is your colour on the big screen.';
    pre = s.ph === 'play' && !!my.c && (my.s === 'wait' || my.s === 'warn') && !!K && gameT() < K.P0 + 1;   // (before you can steer: your bird already shows, with a countdown)
    if (pre) cls += ' pre';
    document.body.classList.toggle('neon', s.ph === 'play' && !!my.c && my.s !== 'out' && my.s !== 'done');
    pad.className = cls; big.innerHTML = txt; msg.textContent = m;
  }
  /* Flying on the phone: the big screen sends the course (where the path runs, when it speeds up) and the obstacles ahead;

     So a slow connection only delays what the big screen shows, never your own flight. (The course maths is a copy of the
     big screen's: keep them the same.) */
  var pre = false, K = null, br = [], clk = null, live = null, fly = false, by = 0.5, bvy = 0, inv = 0, hc = 0, lastSend = 0, back = 0;
  var GRAV = 1.1, LIFT = 1.35, VMAX = 0.6, DRAG = 1.6, R = 0.026;   // (floaty and forgiving: gentler rise and fall, a lower top speed, and a little air drag so it doesn't overshoot)
  function ez(a) { a = Math.max(0, Math.min(1, a)); return a * a * (3 - 2 * a); }
  function diff(x) { if (x >= K.G) return 1 - 0.45 * Math.min(1, (x - K.G) / 1.5); if (x < K.F) return 0.25 * Math.max(0, x - K.S0) / Math.max(1, K.F - K.S0); return Math.min(0.8, 0.4 + 0.4 * (x - K.F) / Math.max(1, K.XE - K.F)); }
  function half(x) { return 0.30 - 0.06 * diff(x); }
  function cen0(x) { var d = diff(x), a = 0.05 + 0.12 * d, y = 0.5 + a * (0.62 * Math.sin(0.85 * x) + 0.28 * Math.sin(2.05 * x + 1.3) + 0.1 * Math.sin((3.6 + 2 * d) * x + 0.4)), h = half(x); return Math.max(h + 0.05, Math.min(1 - h - 0.05, y)); }
  function cen(x) { var c = cen0(x), top = half(x) + 0.03; if (x > K.D0 - 1.6 && x <= K.D0) c = c + (top - c) * ez((x - (K.D0 - 1.6)) / 1.6); else if (x > K.D0 && x < K.F + 0.4) c = top + (cen0(K.F + 0.4) - top) * ez((x - K.D0) / (K.F + 0.4 - K.D0)); return c; }
  function spd(T) { if (T < K.FT) return 1; if (T >= K.TK) return 2.5 * ez((T - K.TK) / 3); if (T >= K.ST) return 0; var D0 = K.ST - 3.3; if (T > D0) return K.FX * (1 - ez((T - D0) / (K.ST - D0))); return 1 + (K.FX - 1) * ez((T - K.FT) / 2.5); }
  function hits(X, y) { var c = cen(X), h = half(X), R = 0.026 * 0.75;   /* (a forgiving hit area, as on the big screen) */ if (X >= K.F && ((X < K.G && y - R < c - h) || y + R > c + h)) return true; for (var i = 0; i < br.length; i++) { var q = br[i]; if (Math.abs(q[0] - X) < 0.02 + R && (q[1] ? y - R < q[2] : y + R > q[2])) return true; } return false; }
  function now() { return performance.now() / 1000; }
  function gameT() { return clk ? clk.t + (now() - clk.at) : 0; }

  addEventListener('resize', size);
  var lastF0 = now();
  function loop() {
    requestAnimationFrame(loop);
    var tn = now(), dt = Math.min(0.05, tn - lastF0); lastF0 = tn;
    if (!fly && pre && K && clk) { if (!CW) size(); drawPre(); return; }
    if (!fly || !K || !clk) return;
    if (!CW) size();
    var cam = camNow(), bx0 = (live && live.x) || 0.53, X = cam + bx0;   // (the big screen's place for your bird, including any knock-back)
    inv = Math.max(0, inv - dt); back = Math.max(0, back - dt * 0.01);
    bvy += (held ? -LIFT : GRAV) * dt; bvy -= bvy * Math.min(1, DRAG * dt); bvy = Math.max(-VMAX, Math.min(VMAX, bvy)); by += bvy * dt;
    if (by < R) { by = R; bvy = 0; } if (by > 1 - R) { by = 1 - R; bvy = 0; }
    if (inv <= 0 && hits(X, by)) { hc++; inv = 1.5; back = Math.min(0.25, back + 0.06); bvy = (cen(X) - by) * 2.5; try { navigator.vibrate && navigator.vibrate(120); } catch (e) {} send(true); }   // (a hit: you saw it, so it counts)

    draw(X);
  }
  function send(now2) { lastSend = now(); if (net) net.toHost('zg', { pid: pid, h: held ? 1 : 0, y: +by.toFixed(3), vy: +bvy.toFixed(3), hc: hc, e: +gameT().toFixed(2) }); }   // (e: the moment of the game this phone is at; the big screen works out the delay from it)
  function draw(X) {

    br.forEach(function (q) { if (q[0] < x0 - 0.1 || q[0] > x1 + 0.1) return; var px = sxp(q[0]), tip = syp(q[2]), base = q[1] ? (inCave(q[0]) ? syp(cen(q[0]) - half(q[0])) : 0) : (inCave(q[0]) ? syp(cen(q[0]) + half(q[0])) : H2);
      cx.fillStyle = 'rgba(190,90,255,.35)'; cx.strokeStyle = 'rgba(215,140,255,1)'; cx.lineWidth = 2;
      if (!q[1] && !inCave(q[0])) { cx.beginPath(); cx.moveTo(px, tip); cx.lineTo(px - kx * 0.1, base); cx.lineTo(px + kx * 0.1, base); cx.closePath(); cx.fill(); cx.stroke(); }   // a pine tree
      else { cx.beginPath(); cx.moveTo(px - kx * 0.05, base); cx.lineTo(px - kx * 0.035, tip); cx.lineTo(px + kx * 0.035, tip); cx.lineTo(px + kx * 0.05, base); cx.closePath(); cx.fill(); cx.stroke(); } });   // a branch
    var gt = gameT(), wi = gt >= K.FT - 0.5 && gt < K.ST ? Math.max(0, (spd(gt) - 1) / (K.FX - 1)) : 0;   // the wind, as on the big screen: streaks rushing past and torn leaves, the faster the more
    if (wi > 0.02) { var hs = function (n) { var v = Math.sin(n * 127.1 + 311.7) * 43758.5453; return v - Math.floor(v); }; cx.save(); cx.lineCap = 'round';
      for (var wl = 0; wl < Math.round(30 * wi); wl++) { var wy = hs(wl + 200) * CH, wsp = CW * (1.6 + hs(wl + 300) * 1.4), wx = CW * 1.2 - ((gt * wsp + hs(wl + 400) * CW * 3) % (CW * 1.5)), wlen = CW * (0.12 + hs(wl + 500) * 0.22) * (0.6 + wi);
        var wg = cx.createLinearGradient(wx, 0, wx + wlen, 0); wg.addColorStop(0, 'rgba(210,225,255,0)'); wg.addColorStop(1, 'rgba(210,225,255,' + (0.14 + 0.22 * hs(wl + 600)) * wi + ')'); cx.strokeStyle = wg; cx.lineWidth = 1 + hs(wl + 700) * 1.6; cx.beginPath(); cx.moveTo(wx, wy); cx.lineTo(wx + wlen, wy + Math.sin(gt * 3 + wl) * 3); cx.stroke(); }
      for (var lf = 0; lf < Math.round(9 * wi); lf++) { var lsp = CW * (1.1 + hs(lf + 800) * 0.9), lx2 = CW * 1.1 - ((gt * lsp + hs(lf + 900) * CW * 2) % (CW * 1.3)), ly2 = hs(lf + 950) * CH + Math.sin(gt * 4 + lf) * CH * 0.03; cx.save(); cx.translate(lx2, ly2); cx.rotate(gt * (4 + lf % 5) + lf); cx.fillStyle = 'rgba(40,80,60,.9)'; cx.beginPath(); cx.ellipse(0, 0, CH * 0.011, CH * 0.005, 0, 0, 7); cx.fill(); cx.restore(); }
      cx.restore(); }
    birdAt(sxp(X), syp(by), sc * 0.032);
    var since = gameT() - K.P0; if (since >= 0 && since < 1.3) bigText('Fly!', 1 - since / 1.3);
  }
  function birdAt(bxp, byp, s2) {   // your bird, in your colour
    var col = (getComputedStyle(document.documentElement).getPropertyValue('--col') || '#ffd166').trim();
    var g = cx.createRadialGradient(bxp, byp, 0, bxp, byp, s2 * 2.6); g.addColorStop(0, col + '88'); g.addColorStop(1, col + '00'); cx.fillStyle = g; cx.beginPath(); cx.arc(bxp, byp, s2 * 2.6, 0, 7); cx.fill();
    if (inv > 0 && Math.floor(inv * 10) % 2) cx.globalAlpha = 0.35;
    cx.fillStyle = '#0b0b14'; cx.strokeStyle = col; cx.lineWidth = 2.5; cx.beginPath(); cx.ellipse(bxp, byp, s2 * 1.05, s2 * 0.62, Math.max(-0.5, Math.min(0.5, bvy * 0.6)), 0, 7); cx.fill(); cx.stroke();
    var wa = held ? Math.sin(performance.now() / 40) : Math.sin(performance.now() / 120) * 0.4; cx.fillStyle = '#1a1a26'; cx.beginPath(); cx.moveTo(bxp - s2 * 0.3, byp - s2 * 0.1); cx.quadraticCurveTo(bxp + s2 * 0.1, byp - s2 * (0.4 + 1.3 * wa), bxp + s2 * 0.45, byp - s2 * 0.05); cx.closePath(); cx.fill();
    cx.fillStyle = '#ffb000'; cx.beginPath(); cx.moveTo(bxp + s2 * 1.0, byp - s2 * 0.25); cx.lineTo(bxp + s2 * 1.5, byp - s2 * 0.1); cx.lineTo(bxp + s2 * 1.0, byp + s2 * 0.05); cx.closePath(); cx.fill();
    cx.globalAlpha = 1;
  }

  function drawPre() {   // before you can steer: your bird in the middle, and how long until it's yours
    cx.clearRect(0, 0, CW, CH); cx.fillStyle = '#0a1030'; cx.fillRect(0, 0, CW, CH);
    var kx = CW / 2.45, s2 = CH * 0.032; by = 0.5 + Math.sin(performance.now() / 700) * 0.01; bvy = 0;
    birdAt(0.35 * kx, CH * by, s2);
    var left = K.P0 - gameT();
    if (left > 0 && left <= 10) bigText(String(Math.ceil(left)), 1, 'until you take over');
    else if (left > 10) bigText('', 1, 'This is your bird. Get ready…');
  }
  requestAnimationFrame(loop);
  // the one button: hold anywhere on the pad
  function press(v) { if (held === v) return; held = v; $('pad').classList.toggle('down', v && $('pad').classList.contains('fly')); if (net) { if (fly) send(true); else net.toHost('zg', { pid: pid, h: v ? 1 : 0 }); } }
  var pad = $('pad');
  pad.addEventListener('touchstart', function (e) { e.preventDefault(); press(true); }, { passive: false });
  pad.addEventListener('touchend', function (e) { e.preventDefault(); press(false); }, { passive: false });
  pad.addEventListener('touchcancel', function () { press(false); });
  pad.addEventListener('mousedown', function () { press(true); });
  addEventListener('mouseup', function () { press(false); });
  addEventListener('blur', function () { press(false); });
  document.addEventListener('visibilitychange', function () { if (document.hidden) press(false); });
  if (room.length === 4 && $('name').value) $('go').focus();
})();
</script>
