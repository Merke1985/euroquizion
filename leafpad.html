<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#031416">
<title>Leaf on the Wind controller</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&display=swap">
<style>
  /* Leaf on the Wind on the phone: join with the room code, then three puff buttons: to the left, straight up, to the right. */
  :root{--ink:#fff;--mute:#bfe3dc;--line:rgba(255,255,255,.16);--col:#7ff5e0}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;background:#031416;color:var(--ink);font-family:"Bricolage Grotesque",system-ui,sans-serif;overflow:hidden;touch-action:manipulation;user-select:none;-webkit-user-select:none;overscroll-behavior:none}
  .screen{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px 16px;gap:14px;text-align:center}
  .hidden{display:none!important}
  h1{margin:0;font-size:1.6rem}
  p{margin:0;color:var(--mute);line-height:1.4}
  input{font:inherit;font-size:1.2rem;font-weight:700;padding:14px 16px;border-radius:14px;border:1px solid var(--line);background:rgba(255,255,255,.06);color:#fff;width:min(320px,100%);text-align:center}
  button.go{font:inherit;font-size:1.15rem;font-weight:800;padding:14px 26px;border-radius:14px;border:0;background:#7ff5e0;color:#032a26}
  .top{position:fixed;left:0;right:0;top:0;display:flex;justify-content:space-between;align-items:center;padding:12px 16px;font-weight:800}
  .top .nm{display:flex;align-items:center;gap:8px} .top .dot{width:14px;height:14px;border-radius:50%;background:var(--col)}
  #breath{letter-spacing:.1em}
  #big{position:fixed;left:16px;right:16px;top:70px;text-align:center;font-size:clamp(1.4rem,7vw,2.2rem);font-weight:800;line-height:1.2}
  #big .small{display:block;font-size:1rem;font-weight:600;color:var(--mute);margin-top:8px}
  #pads{position:fixed;left:12px;right:12px;bottom:max(16px,env(safe-area-inset-bottom));height:min(52vh,330px);display:grid;grid-template-columns:1fr 1.15fr 1fr;gap:10px}
  #pads button{font:inherit;font-size:clamp(2.4rem,13vw,4rem);font-weight:800;border-radius:24px;border:2px solid var(--line);background:rgba(255,255,255,.05);color:rgba(255,255,255,.35);transition:background .12s,transform .08s,border-color .2s}
  body.fly #pads button{background:color-mix(in srgb,var(--col) 28%,transparent);border-color:var(--col);color:#fff;box-shadow:0 0 30px color-mix(in srgb,var(--col) 40%,transparent)}
  body.fly #pads button:active{transform:scale(.96);background:color-mix(in srgb,var(--col) 60%,transparent)}
  body.empty #pads,body.hit #pads{opacity:.4}
  #gust{position:fixed;left:0;right:0;top:46%;text-align:center;font-size:2rem;font-weight:800;opacity:0;transition:opacity .2s}
  #gust.on{opacity:1;animation:gb .5s infinite alternate} @keyframes gb{to{opacity:.4}}
</style>
</head>
<body>
<div class="screen" id="join">
  <h1>🍃 Leaf on the Wind</h1>
  <p>Join the leaves in the enchanted forest.</p>
  <input id="name" maxlength="14" placeholder="Your name" autocomplete="nickname">
  <input id="code" maxlength="4" placeholder="Room code" autocapitalize="characters">
  <button class="go" id="go">Join</button>
  <p id="jmsg"></p>
</div>
<div class="hidden" id="game">
  <div class="top"><span class="nm"><span class="dot" id="dot"></span><span id="me"></span></span><span id="breath"></span></div>
  <div id="big">Watch the big screen</div>
  <div id="gust"></div>
  <div id="pads"><button data-j="-1" type="button">◀</button><button data-j="0" type="button">▲</button><button data-j="1" type="button">▶</button></div>
</div>
<script src="vendor/supabase.js?v=1"></script>
<script src="config.js?v=1"></script>
<script src="net.js?v=2"></script>
<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var st = { get: function (k) { try { return localStorage.getItem(k); } catch (e) { return null; } }, set: function (k, v) { try { localStorage.setItem(k, v); } catch (e) {} } };
  var pid = st.get('lf-pid'); if (!pid) { pid = 'p' + Math.random().toString(36).slice(2, 10); st.set('lf-pid', pid); }
  var q = new URLSearchParams(location.search), room = (q.get('r') || '').toUpperCase().replace(/[^A-Z]/g, '').slice(0, 4);
  $('name').value = st.get('lf-name') || st.get('esc-name') || ''; $('code').value = room;
  var net = null, name = '', joinedOk = false, my = null, lastS = '';
  $('go').addEventListener('click', join);
  function join() {
    name = $('name').value.trim().slice(0, 14); room = $('code').value.toUpperCase().replace(/[^A-Z]/g, '').slice(0, 4);
    if (!name) { $('jmsg').textContent = 'Type your name first.'; return; }
    if (room.length !== 4) { $('jmsg').textContent = 'The room code has 4 letters (it’s on the big screen).'; return; }
    st.set('lf-name', name); $('jmsg').textContent = 'Joining…';
    net = escConnect('lf' + room); net.on('state', onState);
    var hi = function () { if (!joinedOk) net.send('hi', { pid: pid, name: name }); };
    hi(); setInterval(hi, 1500);   // (keep saying hello until the big screen has us)
  }
  function buzz(p) { try { navigator.vibrate && navigator.vibrate(p); } catch (e) {} }
  function onState(s) {
    if (!s || !s.p) return;
    my = s.p[pid] || null;
    if (my && !joinedOk) { joinedOk = true; $('join').classList.add('hidden'); $('game').classList.remove('hidden'); }
    if (!joinedOk) return;
    $('me').textContent = name;
    var big = $('big'), txt = '', cls = '';
    if (!my) { big.innerHTML = 'The leaves are already falling<span class="small">You’ll join the next one</span>'; document.body.className = ''; return; }
    document.documentElement.style.setProperty('--col', my.c || '#8a93b8'); $('dot').style.background = my.c || 'rgba(255,255,255,.25)';
    $('breath').textContent = my.s === 'fly' || my.s === 'hit' ? '💨'.repeat(my.b || 0) + '·'.repeat(4 - (my.b || 0)) : '';
    if (s.ph === 'lobby') txt = 'You’re in, ' + esc(name) + '!<span class="small">Wait for the host to start</span>';
    else if (s.ph === 'ready') txt = 'Find your leaf!<span class="small">Your name and colour on the big screen</span>';
    else if (s.ph === 'end') txt = (my.r === 1 ? '🏆 Your leaf stayed up longest!' : 'You finished ' + ordinal(my.r || 0)) + '<span class="small">' + (my.tm != null ? 'In the air for ' + my.tm + ' s' : 'Still flying at the end') + '</span>';
    else if (my.s === 'down') { txt = '🌫️ The mist took your leaf<span class="small">After ' + my.tm + ' s · ' + (s.n || 0) + ' still in the air</span>'; if (lastS !== 'down') buzz([60, 40, 160]); }
    else if (my.s === 'hit') { cls = 'fly hit'; txt = 'Ouch, a spirit’s arm!<span class="small">Your breath is gone</span>'; if (lastS !== 'hit') buzz(150); }
    else { cls = 'fly' + (my.b < 1 ? ' empty' : ''); txt = my.b < 1 ? 'Out of breath…' : 'Puff!'; txt += '<span class="small">◀ ▲ ▶ steers your leaf</span>'; }
    lastS = my.s || '';
    document.body.className = cls; big.innerHTML = txt;
    var g = $('gust'); g.textContent = s.g > 0 ? 'Gust → coming' : s.g < 0 ? '← Gust coming' : ''; g.classList.toggle('on', !!s.g && my.s === 'fly');
  }
  [].forEach.call(document.querySelectorAll('#pads button'), function (b) {
    var fire = function (e) { e.preventDefault(); if (!net || !my || (my.s !== 'fly' && my.s !== 'hit')) return; net.toHost('zg', { pid: pid, j: +b.getAttribute('data-j') }); buzz(12); };   // (the big screen checks the breath)
    b.addEventListener('touchstart', fire, { passive: false }); b.addEventListener('mousedown', fire);
  });
  if (room.length === 4 && $('name').value) $('go').focus();
})();
</script>
</body>
</html>
