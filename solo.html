<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>EuroQuizion – solo</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&display=swap">
<link rel="stylesheet" href="style.css?v=637">
</head>
<body>
<main class="solo">
  <header><div class="brand"><a class="logo" href="./" style="text-decoration:none;color:inherit">Euro<b>Quizion!</b></a><span id="hud" class="tiny"></span></div><div id="ctrl" class="ctrl hidden"><label class="check"><input type="checkbox" id="auto" checked> Autoplay<span class="wideonly">&nbsp;next song</span></label><select id="autolen" class="mini" aria-label="Autoplay after"><option value="10">10 sec</option><option value="20" selected>20 sec</option><option value="30">30 sec</option><option value="end">Complete song</option></select></div><button class="btn topnext hidden" id="next" type="button">Next</button></header>

  <section id="v-setup" class="card">
    <h2>Play solo</h2>
    <p class="mute" style="margin:.4em 0 0">Just you against the clips. Answer before the time runs out.</p>
    <div class="avatarrow soloprofile" id="profile"><div id="mychar" class="mychar"></div><strong id="myname"></strong><button class="btn alt small" id="changechar" type="button">Edit</button></div>
    <div id="pickbox" class="hidden">
      <div class="field" style="margin:14px 0"><label for="editname">Your name</label><input id="editname" type="text" maxlength="16"></div>
      <label>Avatar</label>
      <div id="chars" class="chargrid"></div>
      <button class="btn" id="pickdone" type="button" style="width:100%;margin:12px 0 4px">Done</button>
    </div>
    <div class="settings">
      <div class="hidden"><label for="s-subject">Category</label><select id="s-subject">
        <option value="random" selected>All</option><option value="facts">Song facts</option><option value="odd">Odd one out</option><option value="mistake">Find the mistake</option><option value="higher">Higher or lower</option><option value="newer">Which is newer</option><option value="lost">Language barrier</option></select></div>
      <div class="multi" id="typebox" data-noneall="1" style="grid-column:1/-1"><label id="typelabel">Trivia</label>
          <button type="button" class="multibtn" aria-haspopup="true" aria-expanded="false" aria-labelledby="typelabel typesum"><span id="typesum">All</span></button>
          <div class="multipanel hidden">
            <label class="swrow"><span><b>Song facts</b><small>Country, artist, title, year, placing</small></span><input type="checkbox" data-type="facts" checked><i class="sw" aria-hidden="true"></i></label>
            <label class="swrow"><span><b>Odd one out</b><small>Three songs share something, one does not</small></span><input type="checkbox" data-type="odd" checked><i class="sw" aria-hidden="true"></i></label>
            <label class="swrow"><span><b>Find the mistake</b><small>Four facts, one is wrong</small></span><input type="checkbox" data-type="mistake" checked><i class="sw" aria-hidden="true"></i></label>
            <label class="swrow"><span><b>Higher or lower</b><small>Two clips: which finished higher?</small></span><input type="checkbox" data-type="higher" checked><i class="sw" aria-hidden="true"></i></label>
            <label class="swrow"><span><b>Which came out later</b><small>Two clips: which song came out later?</small></span><input type="checkbox" data-type="newer" checked><i class="sw" aria-hidden="true"></i></label>
            <label class="swrow"><span><b>Language barrier</b><small>A translated title: which song is it?</small></span><input type="checkbox" data-type="lost" checked><i class="sw" aria-hidden="true"></i></label>
          </div></div>
      <div><label for="s-rounds">Songs</label><select id="s-rounds"><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option><option>6</option><option>7</option><option>8</option><option>9</option><option selected>10</option><option>15</option><option>20</option></select></div>
      <div><label for="s-time">Video length</label><select id="s-time"><option value="5">5 sec</option><option value="10">10 sec</option><option value="20" selected>20 sec</option><option value="30">30 sec</option></select></div>
      <div><label for="s-era">Era</label><select id="s-era">
        <option value="1956-2100" selected>All eras</option><option value="1956-1979">1956 – 1979</option><option value="1980-1999">1980 – 1999</option><option value="2000-2012">2000 – 2012</option><option value="2013-2100">2013 – now</option></select></div>
      <div><label for="s-cat">Entries</label><select id="s-cat">
        <option value="all" selected>All entries</option><option value="nq">Non-qualifiers</option><option value="final">Finalists</option><option value="win">Winners</option></select></div>
      <div style="grid-column:1/-1"><label for="s-skip">Leave out</label><select id="s-skip"><option value="" selected>Nothing</option><option value="il">Israel</option><option value="ru">Russia</option><option value="il,ru">Israel and Russia</option></select></div>
      <div class="hidden"><label for="s-atype">Category</label><select id="s-atype">
        <option value="mc" selected>Multiple choice</option></select></div>
        <div style="grid-column:1/-1"><label for="s-scoring">Scoring</label><select id="s-scoring">
          <option value="correct" selected>Standard</option><option value="speed">Speedy</option></select>
          <p class="mute" id="scorehelp" style="margin:8px 0 0;font-size:.9rem"></p></div>
    </div>
    <button class="btn big" id="start" style="width:100%" disabled>Loading songs…</button>
    <p class="mute" id="songcount" style="margin:12px 0 0;font-size:.9rem"></p>
    <p class="mute" id="best" style="margin:6px 0 0;font-size:.9rem"></p>
  </section>

  <section id="v-game" class="hidden">
    <div class="stage">
      <div id="yt"></div><div id="yt2"></div><div id="pairtag" class="pairtag hidden"></div>
      <div class="shield"></div>
      <div class="maskbar t" id="mt"></div><div class="maskbar b" id="mb"></div>
      <div class="cover" id="cover"><div class="q" id="covericon"></div><h2 id="covertext">Selecting song</h2></div>
    </div>
    <div id="guessui">
      <div class="bar" style="margin-top:14px"><i id="tbar"></i></div>
      <h2 id="qtext" style="margin-top:14px"></h2>
      <div id="opts" class="opts hidden"></div>
      <button class="btn hidden" id="confirm" style="width:100%;margin-top:12px">Confirm answer</button>
      <form id="guessform" autocomplete="off" class="sologuess">
        <input id="guess" type="text" maxlength="80" placeholder="Type the title…" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="send">
        <button class="btn">Guess!</button>
      </form>
      <p id="fb" class="fb"></p>
      <button class="btn alt small hidden" id="skip" type="button">Skip this song</button>
    </div>
    <div id="revealui" class="reveal hidden">
      <div class="barspace" style="margin-top:14px"></div>
      <div class="qrow"><h2 id="rq" class="rq"></h2><span id="autoleft" class="nextin"></span></div>
      <p id="rwhy" class="why"></p>
      <div id="ropts" class="opts"></div>
      <div class="under">
        <div class="songinfo"><p id="ranswer" class="answerline"></p><h2 id="rtitle"></h2><p id="rmeta"></p><p id="rres" class="res"></p></div>
      </div>
    </div>
    <p id="err" class="fb no"></p>
    <button class="btn alt small hidden" id="adskip" type="button">Skip this song</button>
  </section>

  <section id="v-end" class="end hidden">
    <p class="mute" style="font-size:1.2rem;margin:0">Final score</p>
    <div id="endchar" class="winchar"></div>
    <p id="endname" style="font-size:1.4rem;font-weight:800;margin:0"></p>
    <h1 id="final"></h1>
    <p id="endbest" class="mute" style="font-size:1.2rem;margin:0"></p>
    <div style="display:flex;gap:12px;flex-wrap:wrap;justify-content:center">
      <button class="btn big" id="again">Play again</button>
      <a class="btn alt big" href="./" style="text-decoration:none">Back</a>
    </div>
  </section>
</main>
<script src="net.js?v=637"></script>
<script src="music.js?v=637"></script>
<script src="chars.js?v=637"></script>
<script src="match.js?v=637"></script>
<script src="quiz.js?v=637"></script>
<script src="solo.js?v=637"></script>
</body>
</html>
