<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Douze Points – solo</title>
<link rel="stylesheet" href="style.css?v=16">
</head>
<body>
<main class="solo">
  <header><a class="logo" href="./" style="text-decoration:none;color:inherit">DOUZE <b>POINTS</b><i>!</i></a><div id="hud" class="mute"></div></header>

  <section id="v-setup" class="card">
    <h2>Play solo</h2>
    <p class="mute" style="margin:.4em 0 0">Just you against the clips. Answer before the time runs out.</p>
    <div class="settings">
      <div><label for="s-rounds">Songs</label><select id="s-rounds"><option>5</option><option selected>10</option><option>15</option><option>20</option></select></div>
      <div><label for="s-time">Guessing time</label><select id="s-time"><option value="20">20 sec</option><option value="30" selected>30 sec</option><option value="45">45 sec</option></select></div>
      <div><label for="s-era">Years</label><select id="s-era">
        <option value="1956-2100" selected>All years</option><option value="1956-1979">1956 – 1979</option><option value="1980-1999">1980 – 1999</option><option value="2000-2012">2000 – 2012</option><option value="2013-2100">2013 – now</option></select></div>
      <div><label for="s-cat">Entries</label><select id="s-cat">
        <option value="all" selected>All entries</option><option value="nq">Non-qualifiers</option><option value="final">Finalists</option><option value="win">Winners</option></select></div>
      <div><label for="s-atype">Answer type</label><select id="s-atype">
        <option value="mc" selected>Multiple choice</option><option value="open">Open</option><option value="mix">Mix</option></select></div>
      <div><label for="s-subject">Question</label><select id="s-subject">
        <option value="country" selected>Country</option><option value="artist">Artist</option><option value="place">Placement</option><option value="title">Song title</option><option value="random">Random</option></select></div>
      <label class="check"><input type="checkbox" id="s-video" checked> Show video during the clip</label>
    </div>
    <button class="btn big" id="start" style="width:100%" disabled>Loading songs…</button>
    <p class="mute" id="songcount" style="margin:12px 0 0;font-size:.9rem"></p>
    <p class="mute" id="best" style="margin:6px 0 0;font-size:.9rem"></p>
  </section>

  <section id="v-game" class="hidden">
    <div class="stage">
      <div id="yt"></div>
      <div class="shield"></div>
      <div class="maskbar t" id="mt"></div><div class="maskbar b" id="mb"></div>
      <div class="cover" id="cover"><div class="q" id="covericon"></div><h2 id="covertext">Selecting song</h2></div>
    </div>
    <div id="guessui">
      <div class="bar" style="margin-top:14px"><i id="tbar"></i></div>
      <h2 id="qtext" style="margin-top:14px"></h2>
      <div id="opts" class="opts hidden"></div>
      <button class="btn hidden" id="confirm" style="width:100%;margin-top:12px">Confirm answer</button>
      <form id="guessform" autocomplete="off" class="sologuess">
        <input id="guess" type="text" maxlength="80" placeholder="Type the title…" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="send">
        <button class="btn">Guess!</button>
      </form>
      <p id="fb" class="fb"></p>
      <div style="display:flex;gap:10px;flex-wrap:wrap">
        <button class="btn alt small" id="replay">Play again</button>
        <button class="btn alt small" id="skip">Give up</button>
      </div>
    </div>
    <div id="revealui" class="reveal hidden">
      <p id="verdict" class="fb" style="font-size:1.3rem"></p>
      <div class="under">
        <div><p id="ranswer" class="answerline"></p><h2 id="rtitle"></h2><p id="rmeta"></p><p id="rres" class="res"></p></div>
        <div class="autobox">
            <button class="btn big" id="next">Next</button>
            <label class="check"><input type="checkbox" id="auto"> Autoplay next song</label>
            <div id="autoleft" class="mute"></div>
          </div>
      </div>
    </div>
    <p id="err" class="fb no"></p>
  </section>

  <section id="v-end" class="end hidden">
    <p class="mute" style="font-size:1.2rem;margin:0">Final score</p>
    <h1 id="final"></h1>
    <p id="endbest" class="mute" style="font-size:1.2rem;margin:0"></p>
    <div style="display:flex;gap:12px;flex-wrap:wrap;justify-content:center">
      <button class="btn big" id="again">Play again</button>
      <a class="btn alt big" href="./" style="text-decoration:none">Back</a>
    </div>
  </section>
</main>
<script src="net.js?v=16"></script>
<script src="match.js?v=16"></script>
<script src="quiz.js?v=16"></script>
<script src="solo.js?v=16"></script>
</body>
</html>
