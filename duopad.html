<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#160626">
<title>Odd Couples controller</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&display=swap">
<style>
  /* Odd Couples on the phone: one huge button, EVEN or ODD (both if you play alone). The title is only on the big screen. */
  :root{--ink:#fff;--mute:#d9c8f0;--line:rgba(255,255,255,.16);--col:#ff4fa3}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;background:#160626;color:var(--ink);font-family:"Bricolage Grotesque",system-ui,sans-serif;overflow:hidden;touch-action:manipulation;user-select:none;-webkit-user-select:none;overscroll-behavior:none}
  .screen{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px 16px;gap:14px;text-align:center}
  .hidden{display:none!important}
  h1{margin:0;font-size:1.6rem}
  p{margin:0;color:var(--mute);line-height:1.4}
  input{font:inherit;font-size:1.2rem;font-weight:700;padding:14px 16px;border-radius:14px;border:1px solid var(--line);background:rgba(255,255,255,.06);color:#fff;width:min(320px,100%);text-align:center}
  button.go{font:inherit;font-size:1.15rem;font-weight:800;padding:14px 26px;border-radius:14px;border:0;background:#ff4fa3;color:#fff}
  .top{position:fixed;left:0;right:0;top:0;display:flex;justify-content:space-between;align-items:center;padding:12px 16px;font-weight:800}
  .top .dot{display:inline-block;width:14px;height:14px;border-radius:50%;background:var(--col);margin-right:8px;vertical-align:-1px}
  #mate{position:fixed;left:16px;right:16px;top:52px;text-align:center;color:var(--mute);font-weight:700}
  #big{position:fixed;left:16px;right:16px;top:90px;text-align:center;font-size:clamp(1.3rem,6.5vw,2rem);font-weight:800;line-height:1.2}
  #big .small{display:block;font-size:1rem;font-weight:600;color:var(--mute);margin-top:6px}
  #pads{position:fixed;left:14px;right:14px;bottom:max(16px,env(safe-area-inset-bottom));top:190px;display:flex;flex-direction:column;gap:12px}
  #pads button{flex:1;font:inherit;font-size:clamp(2.2rem,13vw,5rem);font-weight:800;letter-spacing:.04em;border-radius:28px;border:3px solid var(--line);background:rgba(255,255,255,.05);color:rgba(255,255,255,.35);transition:background .12s,transform .08s,border-color .2s}
  body.go #pads button{background:color-mix(in srgb,var(--col) 30%,transparent);border-color:var(--col);color:#fff;box-shadow:0 0 40px color-mix(in srgb,var(--col) 40%,transparent)}
  body.go #pads button:active{transform:scale(.97);background:color-mix(in srgb,var(--col) 65%,transparent)}
  #pads button.pick{background:var(--col)!important;color:#fff!important;border-color:#fff!important}
  body.locked #pads button:not(.pick){opacity:.25}
  body.swap #pads{animation:flip .6s ease} @keyframes flip{0%{transform:rotateY(0)}50%{transform:rotateY(90deg)}100%{transform:rotateY(0)}}
</style>
</head>
<body>
<div class="screen" id="join">
  <h1>💞 Odd Couples</h1>
  <p>Join with the room code on the big screen.</p>
  <input id="name" maxlength="14" placeholder="Your name" autocomplete="nickname">
  <input id="code" maxlength="4" placeholder="Room code" autocapitalize="characters">
  <button class="go" id="go">Join</button>
  <p id="jmsg"></p>
</div>
<div class="hidden" id="game">
  <div class="top"><span><span class="dot"></span><span id="me"></span></span><span id="pts"></span></div>
  <div id="mate"></div>
  <div id="big">Watch the big screen</div>
  <div id="pads"></div>
</div>
<script src="vendor/supabase.js?v=1"></script>
<script src="config.js?v=1"></script>
<script src="net.js?v=2"></script>
<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var st = { get: function (k) { try { return localStorage.getItem(k); } catch (e) { return null; } }, set: function (k, v) { try { localStorage.setItem(k, v); } catch (e) {} } };
  var pid = st.get('du-pid'); if (!pid) { pid = 'p' + Math.random().toString(36).slice(2, 10); st.set('du-pid', pid); }
  var q = new URLSearchParams(location.search), room = (q.get('r') || '').toUpperCase().replace(/[^A-Z]/g, '').slice(0, 4);
  $('name').value = st.get('du-name') || st.get('esc-name') || ''; $('code').value = room;
  var net = null, name = '', joinedOk = false, my = null, S = null, padsFor = '', lastRole = '', lastPh = '';
  $('go').addEventListener('click', join);
  function join() {
    name = $('name').value.trim().slice(0, 14); room = $('code').value.toUpperCase().replace(/[^A-Z]/g, '').slice(0, 4);
    if (!name) { $('jmsg').textContent = 'Type your name first.'; return; }
    if (room.length !== 4) { $('jmsg').textContent = 'The room code has 4 letters (it’s on the big screen).'; return; }
    st.set('du-name', name); $('jmsg').textContent = 'Joining…';
    net = escConnect('du' + room); net.on('state', onState);
    var hi = function () { if (!joinedOk) net.send('hi', { pid: pid, name: name }); };
    hi(); setInterval(hi, 1500);   // (keep saying hello until the big screen has us)
  }
  function buzz(p) { try { navigator.vibrate && navigator.vibrate(p); } catch (e) {} }
  function pads(r, sp) {   // your button(s): EVEN or ODD (in a spelling round CORRECT or MISSPELT), or both when you play alone
    if (r + sp === padsFor) return; padsFor = r + sp; var box = $('pads'); box.innerHTML = '';
    (r === 'both' ? [[0, sp ? '✓ CORRECT' : 'EVEN'], [1, sp ? '✗ MISSPELT' : 'ODD']] : r === 'even' ? [[0, sp ? '✓ CORRECT' : 'EVEN']] : r === 'odd' ? [[1, sp ? '✗ MISSPELT' : 'ODD']] : []).forEach(function (x) { var b = document.createElement('button'); b.type = 'button'; b.textContent = x[1]; b.setAttribute('data-v', x[0]);
      var fire = function (ev) { ev.preventDefault(); if (!net || !S || S.ph !== 'show' || !my || my.ans != null) return; net.toHost('zg', { pid: pid, v: x[0] }); my.ans = x[0]; my.who = 'me'; paint(); buzz(30); };
      b.addEventListener('touchstart', fire, { passive: false }); b.addEventListener('mousedown', fire); box.appendChild(b); });
  }
  function onState(s) {
    if (!s || !s.p) return;
    S = s; my = s.p[pid] || null;
    if (my && !joinedOk) { joinedOk = true; $('join').classList.add('hidden'); $('game').classList.remove('hidden'); }
    if (!joinedOk) return; paint();
  }
  function paint() {
    var s = S; $('me').textContent = name;
    var big = $('big'), txt = '', cls = '';
    if (!my) { big.innerHTML = 'A game is in progress<span class="small">You’ll join the next one</span>'; document.body.className = ''; pads(''); $('mate').textContent = ''; return; }
    document.documentElement.style.setProperty('--col', my.c || '#ff4fa3');
    $('pts').textContent = s.ph === 'lobby' ? '' : (my.pts || 0) + ' pts';
    $('mate').innerHTML = my.mate ? 'Your partner: <b style="color:#fff">' + esc(my.mate) + '</b> has ' + (s.md === 'spell' ? (my.mr === 'even' ? 'CORRECT' : 'MISSPELT') : (my.mr || '').toUpperCase()) : s.ph === 'lobby' ? '' : 'You play alone: both buttons are yours';
    var sp = s.md === 'spell' ? 's' : ''; pads(s.ph === 'lobby' ? '' : my.role, sp);
    if (my.role !== lastRole && lastRole && s.ph === 'pre') { cls = 'swap'; buzz([60, 40, 60]); }
    lastRole = my.role || lastRole;
    if (s.ph === 'lobby') txt = 'You’re in, ' + esc(name) + '!<span class="small">Wait for the host to start</span>';
    else if (s.ph === 'pre') txt = (s.sw ? '🔄 Swap! You now have ' + (my.role === 'both' ? 'both' : my.role.toUpperCase()) : 'Get ready…') + '<span class="small">Round ' + s.rd + ' of ' + s.of + '</span>';
    else if (s.ph === 'show') { cls += ' go' + (my.ans != null ? ' locked' : ''); txt = my.ans != null ? (my.who === 'me' ? 'Locked in!' : esc(my.mate || 'Your partner') + ' pressed ' + (sp ? (my.ans ? 'MISSPELT' : 'CORRECT') : my.ans ? 'ODD' : 'EVEN')) : sp ? 'Spelled right?<span class="small">Correct or misspelt? Decide together who presses</span>' : 'Count the words!<span class="small">Even or odd? Decide together who presses</span>'; }
    else if (s.ph === 'reveal') { cls += ' locked'; txt = my.got == null ? 'Counting…' : my.got === 3 ? '🥇 First and right! +3' : my.got ? '✅ Right! +1' : my.ans == null ? 'No answer…' : '❌ Wrong one'; if (my.got != null && lastPh !== 'rev') { buzz(my.got ? 40 : [100, 60, 100]); lastPh = 'rev'; } }
    else if (s.ph === 'end') txt = (my.r === 1 ? '🏆 You won!' : 'You finished ' + ordinal(my.r || 0)) + '<span class="small">' + (my.pts || 0) + ' points</span>';
    if (s.ph !== 'reveal') lastPh = s.ph;
    document.body.className = cls.trim(); big.innerHTML = txt;
    [].forEach.call(document.querySelectorAll('#pads button'), function (b) { b.classList.toggle('pick', my.ans != null && my.ans === +b.getAttribute('data-v') && s.ph !== 'pre'); });
  }
  if (room.length === 4 && $('name').value) $('go').focus();
})();
</script>
</body>
</html>
