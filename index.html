<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Douze Points – join</title>
<link rel="stylesheet" href="style.css?v=20">
</head>
<body>
<div id="demo" class="demo hidden">Demo mode – only works between tabs in this browser</div>
<main class="phone">
  <header><div class="logo">DOUZE <b>POINTS</b><i>!</i></div><div id="me" class="mute"></div></header>

  <section id="v-join" class="card">
    <h2 style="margin-bottom:16px">Join the game</h2>
    <form id="joinform" autocomplete="off">
      <div class="field"><label for="code">Room code</label><input id="code" type="text" maxlength="4" inputmode="text" autocapitalize="characters" placeholder="ABCD" required></div>
      <div class="field"><label for="name">Your name</label><input id="name" type="text" maxlength="16" placeholder="E.g. Loreen" required></div>
      <button class="btn big" style="width:100%">Join</button>
      <p id="joinerr" class="fb no" style="margin:14px 0 0"></p>
    </form>
    <div class="or"><span>or</span></div>
    <a class="btn alt big" href="host.html" style="display:block;text-align:center;text-decoration:none">Host a game</a>
    <a class="btn alt big" href="solo.html" style="display:block;text-align:center;text-decoration:none;margin-top:12px">Play solo</a>
    <p class="mute" style="margin:12px 0 0;font-size:.9rem;text-align:center">Host on a TV or laptop everyone can see and hear, or play on your own.</p>
    <p style="margin:18px 0 0;font-size:.8rem;text-align:center"><a href="credits.html" style="color:var(--mute)">Photo credits</a></p>
  </section>

  <section id="v-pick" class="hidden">
    <h2>Pick your character</h2>
    <p class="mute" style="margin:.4em 0 14px">Each one can only be taken once.</p>
    <div id="chars" class="chargrid"></div>
    <p id="pickerr" class="fb no" style="margin:14px 0 0"></p>
  </section>

  <section id="v-wait" class="center hidden"><div id="mychar" class="mychar"></div><h1 class="huge" id="waittitle"></h1><p class="mute" id="waitsub"></p><button class="btn alt small hidden" id="changechar" style="align-self:center">Change character</button></section>

  <section id="v-guess" class="hidden" style="display:flex;flex-direction:column;gap:14px">
    <div class="mute" id="roundlabel"></div>
    <h2 id="qtext">Which song is this?</h2>
    <div class="bar"><i id="pbar"></i></div>
    <form id="guessform" autocomplete="off">
      <input id="guess" type="text" maxlength="80" placeholder="Type the title…" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="send">
      <button class="btn big" style="width:100%;margin-top:12px">Guess!</button>
    </form>
    <div id="opts" class="opts hidden"></div>
    <p id="fb" class="fb"></p>
  </section>

  <section id="v-reveal" class="center hidden">
    <p id="verdict" class="fb" style="font-size:1.4rem"></p>
    <div id="ropts" class="opts"></div>
    <p id="rpts" class="rpts"></p>
    <div class="card"><p id="ranswer" class="answerline"></p><h2 id="rtitle"></h2><p id="rmeta" style="margin:.5em 0 0"></p><p id="rres" class="res" style="margin:.4em 0 0"></p></div>
    <div><div class="mute">Your score</div><div class="score" id="myscore">0</div><div class="mute" id="myrank"></div></div>
  </section>
</main>
<script src="vendor/supabase.js?v=20"></script>
<script src="config.js?v=20"></script>
<script src="match.js?v=20"></script>
<script src="quiz.js?v=20"></script>
<script src="net.js?v=20"></script>
<script src="chars.js?v=20"></script>
<script src="player.js?v=20"></script>
</body>
</html>
