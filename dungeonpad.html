<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#140e0c">
<title>Guardian's Vault controller</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&display=swap">
<style>
  /* The Guardian's Vault on the phone: three chest buttons (gold, silver, bronze) and your lives. The riddles are only on the big screen. */
  :root{--ink:#fff;--mute:#cdbfa8;--line:rgba(255,230,190,.18)}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;background:#140e0c;color:var(--ink);font-family:"Bricolage Grotesque",system-ui,sans-serif;overflow:hidden;touch-action:manipulation;user-select:none;-webkit-user-select:none;overscroll-behavior:none}
  .screen{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px 16px;gap:14px;text-align:center}
  .hidden{display:none!important}
  h1{margin:0;font-size:1.6rem}
  p{margin:0;color:var(--mute);line-height:1.4}
  input{font:inherit;font-size:1.2rem;font-weight:700;padding:14px 16px;border-radius:14px;border:1px solid var(--line);background:rgba(255,255,255,.06);color:#fff;width:min(320px,100%);text-align:center}
  button.go{font:inherit;font-size:1.15rem;font-weight:800;padding:14px 26px;border-radius:14px;border:0;background:#ffcf5a;color:#2a1700}
  .top{position:fixed;left:0;right:0;top:0;display:flex;justify-content:space-between;align-items:center;padding:12px 16px;font-weight:800}
  #big{position:fixed;left:16px;right:16px;top:64px;text-align:center;font-size:clamp(1.3rem,6.5vw,2rem);font-weight:800;line-height:1.2}
  #big .small{display:block;font-size:1rem;font-weight:600;color:var(--mute);margin-top:6px}
  #pads{position:fixed;left:14px;right:14px;bottom:max(16px,env(safe-area-inset-bottom));top:170px;display:flex;flex-direction:column;gap:12px}
  #pads button{flex:1;font:inherit;font-size:clamp(1.8rem,10vw,3rem);font-weight:800;letter-spacing:.06em;border-radius:24px;border:3px solid rgba(255,255,255,.15);color:#1b120a;opacity:.35;transition:opacity .2s,transform .08s,box-shadow .2s}
  #pads button[data-c="0"]{background:linear-gradient(180deg,#ffe58a,#f2c230)} #pads button[data-c="1"]{background:linear-gradient(180deg,#ffffff,#c4ccd6)} #pads button[data-c="2"]{background:linear-gradient(180deg,#f0b17a,#cd7f3f)}
  body.go #pads button{opacity:.85}
  body.go #pads button:active{transform:scale(.97)}
  #pads button.pick{opacity:1!important;border-color:#fff;box-shadow:0 0 0 4px #fff,0 0 34px rgba(255,255,255,.6)}
  #pads button.pick::after{content:' ✓'}
  body.out #pads{opacity:.15}
</style>
</head>
<body>
<div class="screen" id="join">
  <h1>⚔️ The Guardian's Vault</h1>
  <p>Join with the room code on the big screen.</p>
  <input id="name" maxlength="14" placeholder="Your name" autocomplete="nickname">
  <input id="code" maxlength="4" placeholder="Room code" autocapitalize="characters">
  <button class="go" id="go">Join</button>
  <p id="jmsg"></p>
</div>
<div class="hidden" id="game">
  <div class="top"><span id="me"></span><span id="lives"></span></div>
  <div id="big">Watch the big screen</div>
  <div id="pads"><button type="button" data-c="0">GOLD</button><button type="button" data-c="1">SILVER</button><button type="button" data-c="2">BRONZE</button></div>
</div>
<script src="vendor/supabase.js?v=1"></script>
<script src="config.js?v=1"></script>
<script src="net.js?v=2"></script>
<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var st = { get: function (k) { try { return localStorage.getItem(k); } catch (e) { return null; } }, set: function (k, v) { try { localStorage.setItem(k, v); } catch (e) {} } };
  var pid = st.get('dg-pid'); if (!pid) { pid = 'p' + Math.random().toString(36).slice(2, 10); st.set('dg-pid', pid); }
  var q = new URLSearchParams(location.search), room = (q.get('r') || '').toUpperCase().replace(/[^A-Z]/g, '').slice(0, 4);
  $('name').value = st.get('dg-name') || st.get('esc-name') || ''; $('code').value = room;
  var net = null, name = '', joinedOk = false, my = null, S = null, buzzed = '';
  var NAMES = ['GOLD', 'SILVER', 'BRONZE'];
  $('go').addEventListener('click', join);
  function join() {
    name = $('name').value.trim().slice(0, 14); room = $('code').value.toUpperCase().replace(/[^A-Z]/g, '').slice(0, 4);
    if (!name) { $('jmsg').textContent = 'Type your name first.'; return; }
    if (room.length !== 4) { $('jmsg').textContent = 'The room code has 4 letters (it’s on the big screen).'; return; }
    st.set('dg-name', name); $('jmsg').textContent = 'Joining…';
    net = escConnect('dg' + room); net.on('state', onState);
    var hi = function () { if (!joinedOk) net.send('hi', { pid: pid, name: name }); };
    hi(); setInterval(hi, 1500);   // (keep saying hello until the big screen has us)
  }
  function buzz(p) { try { navigator.vibrate && navigator.vibrate(p); } catch (e) {} }
  function onState(s) { if (!s || !s.p) return; S = s; my = s.p[pid] || null; if (my && !joinedOk) { joinedOk = true; $('join').classList.add('hidden'); $('game').classList.remove('hidden'); } if (joinedOk) paint(); }
  function paint() {
    var s = S, big = $('big'), txt = '', cls = ''; $('me').textContent = name;
    if (!my) { big.innerHTML = 'A game is in progress<span class="small">You’ll join the next one</span>'; document.body.className = 'out'; return; }
    var lv = s.lv || 2, l = Math.max(0, my.l == null ? lv : my.l); $('lives').textContent = s.ph === 'lobby' ? '' : '❤️'.repeat(l) + '🖤'.repeat(lv - l);
    if (s.ph === 'lobby') txt = 'You’re in, ' + esc(name) + '!<span class="small">Wait for the host to start</span>';
    else if (s.ph === 'intro') txt = 'Enter the vault…<span class="small">Watch the big screen</span>';
    else if (l <= 0 && s.ph !== 'end') { cls = 'out'; txt = '💀 You’re out<span class="small">Watch the others; can you solve it?</span>'; }
    else if (s.ph === 'think') { cls = 'go'; txt = my.pk != null ? NAMES[my.pk] + ' chosen<span class="small">You can still change · ' + s.left + ' s</span>' : 'Which chest?<span class="small">Read the riddles on the big screen · ' + s.left + ' s</span>'; }
    else if (s.ph === 'smash') txt = '⚔️ The Guardian rises…<span class="small">' + (my.pk != null ? 'You picked ' + NAMES[my.pk] : 'You picked nothing!') + '</span>';
    else if (s.ph === 'after') { txt = my.ok ? '💎 Safe! Treasure found' : '💥 Smashed!' + (my.hurt ? '<span class="small">You lose a life</span>' : '<span class="small">…but the Guardian spared you</span>'); var key = s.rd + ':' + my.ok; if (buzzed !== key) { buzzed = key; buzz(my.ok ? 40 : [150, 60, 150]); } }
    else if (s.ph === 'end') txt = (my.r === 1 ? '🏆 You claim the treasure!' : 'You finished ' + ordinal(my.r || 0)) + '<span class="small">Thanks for playing</span>';
    document.body.className = cls; big.innerHTML = txt;
    [].forEach.call(document.querySelectorAll('#pads button'), function (b) { b.classList.toggle('pick', my.pk === +b.getAttribute('data-c') && s.ph !== 'lobby' && s.ph !== 'intro'); });
  }
  [].forEach.call(document.querySelectorAll('#pads button'), function (b) {
    var fire = function (ev) { ev.preventDefault(); if (!net || !S || S.ph !== 'think' || !my || my.l <= 0) return; var c = +b.getAttribute('data-c'); net.toHost('zg', { pid: pid, c: c }); my.pk = c; paint(); buzz(25); };
    b.addEventListener('touchstart', fire, { passive: false }); b.addEventListener('mousedown', fire);
  });
  if (room.length === 4 && $('name').value) $('go').focus();
})();
</script>
</body>
</html>
