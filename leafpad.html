<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#031416">
<title>Leaf on the Wind controller</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&display=swap">
<style>
  /* Leaf on the Wind on the phone: join with the room code, then just the exit buttons (1 to 5). The puzzle itself is only on the big screen. */
  :root{--ink:#fff;--mute:#bfe3dc;--line:rgba(255,255,255,.16);--col:#7ff5e0}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;background:#031416;color:var(--ink);font-family:"Bricolage Grotesque",system-ui,sans-serif;overflow:hidden;touch-action:manipulation;user-select:none;-webkit-user-select:none;overscroll-behavior:none}
  .screen{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px 16px;gap:14px;text-align:center}
  .hidden{display:none!important}
  h1{margin:0;font-size:1.6rem}
  p{margin:0;color:var(--mute);line-height:1.4}
  input{font:inherit;font-size:1.2rem;font-weight:700;padding:14px 16px;border-radius:14px;border:1px solid var(--line);background:rgba(255,255,255,.06);color:#fff;width:min(320px,100%);text-align:center}
  button.go{font:inherit;font-size:1.15rem;font-weight:800;padding:14px 26px;border-radius:14px;border:0;background:#7ff5e0;color:#032a26}
  .top{position:fixed;left:0;right:0;top:0;display:flex;justify-content:space-between;align-items:center;padding:12px 16px;font-weight:800}
  .top .nm{display:flex;align-items:center;gap:8px} .top .leaf{font-size:1.3rem;filter:drop-shadow(0 0 6px var(--col))}
  #big{position:fixed;left:16px;right:16px;top:70px;text-align:center;font-size:clamp(1.4rem,7vw,2.2rem);font-weight:800;line-height:1.2}
  #big .small{display:block;font-size:1rem;font-weight:600;color:var(--mute);margin-top:8px}
  #pads{position:fixed;left:12px;right:12px;bottom:max(16px,env(safe-area-inset-bottom));height:min(46vh,300px);display:grid;gap:10px}
  #pads button{font:inherit;font-size:clamp(2.2rem,12vw,3.6rem);font-weight:800;border-radius:22px;border:2px solid var(--line);background:rgba(255,255,255,.05);color:rgba(255,255,255,.35);transition:background .12s,transform .08s,border-color .2s}
  body.go #pads button{background:rgba(127,245,224,.14);border-color:rgba(127,245,224,.6);color:#fff}
  body.go #pads button:active{transform:scale(.96)}
  #pads button.pick{background:var(--col)!important;color:#032a26!important;border-color:#fff!important}
  #pads button.right{box-shadow:0 0 0 4px #8dff8a,0 0 30px #8dff8a}
  body.done #pads button:not(.pick){opacity:.3}
</style>
</head>
<body>
<div class="screen" id="join">
  <h1>🍃 Leaf on the Wind</h1>
  <p>Join the leaves in the enchanted forest.</p>
  <input id="name" maxlength="14" placeholder="Your name" autocomplete="nickname">
  <input id="code" maxlength="4" placeholder="Room code" autocapitalize="characters">
  <button class="go" id="go">Join</button>
  <p id="jmsg"></p>
</div>
<div class="hidden" id="game">
  <div class="top"><span class="nm"><span class="leaf">🍃</span><span id="me"></span></span><span id="pts"></span></div>
  <div id="big">Watch the big screen</div>
  <div id="pads"></div>
</div>
<script src="vendor/supabase.js?v=1"></script>
<script src="config.js?v=1"></script>
<script src="net.js?v=2"></script>
<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var st = { get: function (k) { try { return localStorage.getItem(k); } catch (e) { return null; } }, set: function (k, v) { try { localStorage.setItem(k, v); } catch (e) {} } };
  var pid = st.get('lf-pid'); if (!pid) { pid = 'p' + Math.random().toString(36).slice(2, 10); st.set('lf-pid', pid); }
  var q = new URLSearchParams(location.search), room = (q.get('r') || '').toUpperCase().replace(/[^A-Z]/g, '').slice(0, 4);
  $('name').value = st.get('lf-name') || st.get('esc-name') || ''; $('code').value = room;
  var net = null, name = '', joinedOk = false, my = null, S = null, nPads = 0, lastPh = '', lastRd = 0;
  $('go').addEventListener('click', join);
  function join() {
    name = $('name').value.trim().slice(0, 14); room = $('code').value.toUpperCase().replace(/[^A-Z]/g, '').slice(0, 4);
    if (!name) { $('jmsg').textContent = 'Type your name first.'; return; }
    if (room.length !== 4) { $('jmsg').textContent = 'The room code has 4 letters (it’s on the big screen).'; return; }
    st.set('lf-name', name); $('jmsg').textContent = 'Joining…';
    net = escConnect('lf' + room); net.on('state', onState);
    var hi = function () { if (!joinedOk) net.send('hi', { pid: pid, name: name }); };
    hi(); setInterval(hi, 1500);   // (keep saying hello until the big screen has us)
  }
  function buzz(p) { try { navigator.vibrate && navigator.vibrate(p); } catch (e) {} }
  function pads(n) {   // one big button per exit, in a row (1 to 5)
    if (n === nPads) return; nPads = n; var box = $('pads'); box.style.gridTemplateColumns = 'repeat(' + n + ',1fr)'; box.innerHTML = '';
    for (var i = 0; i < n; i++) { var b = document.createElement('button'); b.type = 'button'; b.textContent = String(i + 1); b.setAttribute('data-e', i); (function (b, i) { var fire = function (ev) { ev.preventDefault(); if (!net || !S || (S.ph !== 'look' && S.ph !== 'mist') || !my || my.a != null) return; net.toHost('zg', { pid: pid, e: i }); my.a = i; paint(); buzz(25); }; b.addEventListener('touchstart', fire, { passive: false }); b.addEventListener('mousedown', fire); })(b, i); box.appendChild(b); }
  }
  function onState(s) {
    if (!s || !s.p) return;
    S = s; my = s.p[pid] || null;
    if (my && !joinedOk) { joinedOk = true; $('join').classList.add('hidden'); $('game').classList.remove('hidden'); }
    if (!joinedOk) return;
    if (s.ph === 'look' && (lastPh !== 'look' || s.rd !== lastRd)) buzz(40);
    lastPh = s.ph; lastRd = s.rd; paint();
  }
  function paint() {
    var s = S; if (!s) return; $('me').textContent = name;
    var big = $('big'), txt = '', cls = '';
    if (!my) { big.innerHTML = 'A game is in progress<span class="small">You’ll join the next one</span>'; document.body.className = ''; $('pads').innerHTML = ''; nPads = 0; return; }
    document.documentElement.style.setProperty('--col', my.c || '#7ff5e0');
    $('pts').textContent = s.ph === 'lobby' ? '' : '🍃 ' + (my.pts || 0);
    pads(s.ph === 'lobby' || s.ph === 'intro' ? 0 : s.n || 3);
    if (s.ph === 'lobby') txt = 'You’re in, ' + esc(name) + '!<span class="small">Wait for the host to start</span>';
    else if (s.ph === 'intro') txt = 'Find your leaf!<span class="small">Your colour, at the top of a vine on the big screen</span>';
    else if (s.ph === 'look' || s.ph === 'mist') { cls = my.a != null ? 'go done' : 'go'; txt = my.a != null ? 'Exit ' + (my.a + 1) + ' it is!<span class="small">Wait for the others</span>' : (s.ph === 'look' ? 'Look at the big screen!' : 'Quick, tap your exit!') + '<span class="small">Round ' + s.rd + ' of ' + s.of + (s.left != null ? ' · ' + s.left + ' s' : '') + '</span>'; }
    else if (s.ph === 'reveal') { cls = 'done'; txt = 'Watch your leaf…'; }
    else if (s.ph === 'after') { cls = 'done'; txt = my.ok ? '🍃 Right! Your leaf climbs' : my.a == null ? 'Too late!<span class="small">It was exit ' + ((my.e || 0) + 1) + '</span>' : 'Not this time<span class="small">It was exit ' + ((my.e || 0) + 1) + '</span>'; }
    else if (s.ph === 'end') txt = (my.r === 1 ? '🏆 Your leaf climbed highest!' : 'You finished ' + ordinal(my.r || 0)) + '<span class="small">' + (my.pts || 0) + ' of ' + s.of + ' right</span>';
    document.body.className = cls; big.innerHTML = txt;
    [].forEach.call(document.querySelectorAll('#pads button'), function (b) { var e = +b.getAttribute('data-e'); b.classList.toggle('pick', my.a === e && s.ph !== 'lobby'); b.classList.toggle('right', s.ph === 'after' && my.e === e); });
  }
  if (room.length === 4 && $('name').value) $('go').focus();
})();
</script>
</body>
</html>
